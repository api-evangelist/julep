aid: julep
name: Julep
description: >-
  Julep is an open-source platform for building stateful AI agents that remember
  past interactions and execute long-running, multi-step tasks. Its cloud API and
  self-hostable server expose agents, sessions, tasks, executions, documents (RAG),
  tools, users, projects, secrets, and files, along with a task-workflow engine that
  supports decisions, loops, parallel branches, and integrations to external tools and
  APIs. Official Python and TypeScript SDKs and a command-line interface wrap the REST
  API; authentication is via API key. Julep is Apache-2.0 licensed and backed by
  Version One Ventures.
