          description: The number of seconds to sleep for
          default: 0
        minutes:
          type: integer
          format: uint16
          minimum: 0
          maximum: 60
          description: The number of minutes to sleep for
          default: 0
        hours:
          type: integer
          format: uint16
          minimum: 0
          maximum: 24
          description: The number of hours to sleep for
