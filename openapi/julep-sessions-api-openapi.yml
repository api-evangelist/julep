          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
          description: When this resource was created as UTC date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: When this resource was updated as UTC date-time
          readOnly: true
        kind:
          type: string
          description: Discriminator property for Session.
      discriminator:
        propertyName: kind
        mapping:
